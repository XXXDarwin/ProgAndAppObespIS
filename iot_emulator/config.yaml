# iot_emulator/config.yaml
seed: 42

climate:
  fs_hz: 0.2            # частота выборки, период 5 с
  t_start: 22.0         # начальная температура зоны, °C
  humidity: 45.0        # влажность зоны, %
  tau_s: 120.0          # инерция среды, с
  sigma_t: 0.3          # шум датчика температуры, °C
  sigma_h: 1.0          # шум датчика влажности, %
  step_t: 0.1           # шаг квантования температуры
  step_h: 0.1           # шаг квантования влажности
  drift_per_h: 0.0      # дрейф температуры, °C в час
  harmonics:
    amplitudes: [0.8, 0.3, 0.1]
    frequencies_hz: [0.010, 0.030, 0.080]   # все меньше Fs/2 = 0,1 Гц

weight:
  fs_hz: 1.0            # частота выборки, период 1 с
  sigma_g: 1.5          # шум тракта тензодатчик + АЦП, г
  step_g: 0.5           # эффективное разрешение, г
  zero_offset_g: 0.0    # смещение нуля, г
  settle_tau_s: 0.15    # затухание колебаний при снятии груза, с
  omega_rad_s: 15.0     # частота колебаний, рад/с