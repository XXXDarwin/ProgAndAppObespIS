version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: wms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wms_db
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_user -d wms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: wms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://wms_user:wms_pass@db:5432/wms_db
      DATABASE_URL_SYNC: postgresql+psycopg2://wms_user:wms_pass@db:5432/wms_db
      SECRET_KEY: super-secret-key-change-in-production-32chars
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_models
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: wms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    container_name: wms_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  ml_models:
